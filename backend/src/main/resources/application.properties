# Render injects the PORT environment variable ? must use it
server.port=${PORT:10000}
server.address=0.0.0.0

# H2 file-based (works on Render Free with Persistent Disk and concurrent local dev)
spring.datasource.url=jdbc:h2:file:./data/stevechat;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production (security)
spring.h2.console.enabled=false

# JWT - CHANGE THIS in production!
jwt.secret=${JWT_SECRET:steve-chat-super-secret-key-change-me-in-prod-123456}
jwt.expiration-ms=86400000

# Media upload (supports high quality video walkie-talkie / polos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB