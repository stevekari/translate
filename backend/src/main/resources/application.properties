# Render / Railway / Cloud Host PORT injection
server.port=${PORT:10000}
server.address=0.0.0.0

# Database Configuration:
# In Production: Automatically connects to Supabase PostgreSQL when environment variables are set
# In Local Dev: Safely falls back to H2 file-based storage if no Supabase URL is set
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/stevechat;DB_CLOSE_DELAY=-1}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Hibernate / JPA configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool (Optimized for Supabase Poolers & Cloud latency)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# Disable H2 console in production (security)
spring.h2.console.enabled=false

# JWT - CHANGE THIS in production!
jwt.secret=${JWT_SECRET:steve-chat-super-secret-key-change-me-in-prod-123456}
jwt.expiration-ms=86400000

# Media upload (supports high quality video walkie-talkie / polos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB