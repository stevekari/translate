<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- Primary Meta Tags -->
    <title>Tranchat</title>
    <meta
      name="description"
      content="Connect instantly. Translate messages live. Chat securely on any device."
    />
    <!-- PWA & Mobile Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tranchat" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      window.deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(
          new CustomEvent("pwa-prompt-ready", { detail: e }),
        );
      });
      window.addEventListener("appinstalled", function () {
        window.deferredPrompt = null;
        window.dispatchEvent(new Event("pwa-installed"));
      });
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/gc.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/gc.png" />
